# Keep the ontology files in ontology/ in step with the latest PLANA, BSPO and ECO releases.
#
# Runs weekly (and on demand: Actions tab -> "PLANA closure" -> Run workflow). It downloads the
# published plana.owl, bspo.owl and eco.owl, and ONLY IF any release differs from
# ontology/releases.txt, it rewrites:
#   plana-closure.tsv   every inferred PLANA relationship (relation-graph: any depth, is_a combined
#                       with part of / contained in / develops from / ..., and PLANA's logical
#                       definitions) -- replaces the Owlery server
#   eco-closure.tsv     every inferred ECO relationship (evidence types: "any kind of in situ")
#   plana-terms.tsv     names, synonyms (with their kind), definitions, obsolete / replaced-by
#   bspo-terms.tsv      the same for BSPO (spatial terms used in PAGE curations)
#   eco-terms.tsv       the same for ECO (evidence codes)
#   releases.txt        which release each file came from
# MOOP loads these files. Nothing in the PLANA repository is touched.
#
# Uses the same ODK image as the PLANA build (obophenotype/planaria-ontology, ODK v1.4).
name: PLANA closure

on:
  schedule:
    - cron: '17 6 * * 1'        # Mondays 06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write                # to commit the refreshed files

jobs:
  closure:
    runs-on: ubuntu-latest
    container: obolibrary/odkfull:v1.4
    steps:
      - uses: actions/checkout@v4

      - name: Download the ontologies and read their releases
        id: release
        run: |
          : > releases.new
          for o in plana bspo eco; do
            curl -sSfL -o "$o.owl" "http://purl.obolibrary.org/obo/$o.owl"
            r=$(grep -o -m1 "obo/$o/releases/[0-9-]*" "$o.owl" | cut -d/ -f4)
            [ -n "$r" ] || { echo "no release found in $o.owl"; exit 1; }
            echo "$o $r" >> releases.new
          done
          cat releases.new
          # Also rebuild when an expected file is missing (a new file was added to this workflow,
          # or one was deleted) -- otherwise unchanged releases would skip it forever.
          missing=no
          for f in plana-closure.tsv eco-closure.tsv plana-terms.tsv bspo-terms.tsv eco-terms.tsv; do
            [ -s "ontology/$f" ] || { echo "missing: ontology/$f"; missing=yes; }
          done
          if [ "$missing" = no ] && cmp -s releases.new ontology/releases.txt; then
            echo "already done"; echo "changed=no" >> "$GITHUB_OUTPUT"
          else
            echo "changed=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute every inferred PLANA and ECO relationship
        if: steps.release.outputs.changed == 'yes'
        run: |
          # Subject, relationship, object -- one row per inferred link. Subclass links are written
          # as rdfs:subClassOf. Reflexive links (X is_a X) are left out.
          # PLANA: anatomy and life-cycle stages (BSPO terms PLANA imports are included).
          # ECO:   evidence types, so "any kind of in situ hybridization evidence" works.
          for o in plana eco; do
            relation-graph --ontology-file "$o.owl" --output-file "$o-closure.raw" --mode tsv \
              --output-subclasses true --reflexive-subclasses false --equivalence-as-subclass true \
              --obo-prefixes true
            { printf 'subject\trelation\tobject\n'; sort -u "$o-closure.raw"; } > "ontology/$o-closure.tsv"
            wc -l "ontology/$o-closure.tsv"
          done

      - name: Export names, synonyms, definitions, obsolete terms
        if: steps.release.outputs.changed == 'yes'
        run: |
          for o in plana bspo eco; do
            robot query --input "$o.owl" --query ontology/terms.rq "$o-raw.tsv"
            python3 ontology/tidy_terms.py "$o-raw.tsv" "ontology/$o-terms.tsv"
          done
          cp releases.new ontology/releases.txt

      - name: Commit
        if: steps.release.outputs.changed == 'yes'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q --ignore-unmatch ontology/plana-release.txt
          git add ontology/plana-closure.tsv ontology/eco-closure.tsv ontology/plana-terms.tsv \
                  ontology/bspo-terms.tsv ontology/eco-terms.tsv ontology/releases.txt
          git commit -m "Ontology files for: $(tr '\n' ' ' < ontology/releases.txt)"
          git push
